<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Criar Conta | Radar Local IA</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css', v='20260529c') }}">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="login-body">
    <div class="login-container">
        <a href="/" class="login-logo text-center">
            <span class="logo-icon">🧭</span>
            <span class="logo-text">Radar Local <span class="accent-text">IA</span></span>
        </a>

        <div class="glass-card login-card">
            <h2>Crie sua conta</h2>
            <p class="login-subtitle">Crie sua conta e comece a validar leads antes de abordar.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="flash-list">
                        {% for category, message in messages %}
                            <div class="flash {{ category }}">{{ message }}</div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            <form method="post" action="{{ url_for('cadastro') }}" class="login-form">
                <label>
                    Nome
                    <input type="text" name="nome" required placeholder="Seu nome">
                </label>
                <label>
                    E-mail
                    <input type="email" name="email" required placeholder="seu@email.com">
                </label>
                <label>
                    Senha
                    <input type="password" name="senha" required placeholder="Crie uma senha">
                </label>
                <label>
                    Confirmar senha
                    <input type="password" name="confirmar_senha" required placeholder="Confirme sua senha">
                </label>
                <button type="submit" class="btn btn-primary btn-full">Criar conta</button>
            </form>

            <div class="demo-shortcut-box">
                <p>Já tem conta?</p>
                <a href="{{ url_for('login') }}" class="btn btn-secondary btn-full">Entrar</a>
            </div>
        </div>
    </div>
</body>
</html>
